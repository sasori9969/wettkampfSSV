<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SSV 1928 Sulzbach e.V. – Wettkämpfe
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <h1>
        SSV 1928 Sulzbach e.V.
    </h1>


    <nav>

        <a href="index.html">
            Startseite
        </a>

        <a href="wettkaempfe.html">
            Wettkämpfe
        </a>

        <a href="teilnehmer.html">
            Teilnehmer
        </a>

        <a href="ergebnisse.html">
            Ergebnisse
        </a>

    </nav>

</header>



<main>


    <!-- ==========================================
         NEUEN WETTKAMPF ANLEGEN
         ========================================== -->

    <section class="card">

        <h2>
            Wettkampf anlegen
        </h2>


        <form id="wettkampf-form">


            <div class="form-group">

                <label for="wettkampf-name">
                    Wettkampfname
                </label>

                <input
                    type="text"
                    id="wettkampf-name"
                    placeholder="z. B. Vereinsmeisterschaft 2026"
                    required
                >

            </div>



            <div class="form-group">

                <label for="wettkampf-datum">
                    Datum
                </label>

                <input
                    type="date"
                    id="wettkampf-datum"
                    required
                >

            </div>



            <div class="form-group">

                <label for="anzahl-ergebnisse">
                    Anzahl Ergebnisse pro Start
                </label>

                <input
                    type="number"
                    id="anzahl-ergebnisse"
                    min="1"
                    value="3"
                    required
                >

            </div>



            <div class="form-group">

                <label for="teamgroesse">
                    Teamgröße
                </label>

                <input
                    type="number"
                    id="teamgroesse"
                    min="1"
                    value="3"
                    required
                >

            </div>



            <div class="form-group">

                <label for="wettkampf-status">
                    Status
                </label>

                <select id="wettkampf-status">

                    <option value="geplant">
                        Geplant
                    </option>

                    <option value="laufend">
                        Laufend
                    </option>

                    <option value="beendet">
                        Beendet
                    </option>

                </select>

            </div>



            <button type="submit">
                Wettkampf anlegen
            </button>


        </form>


        <p
            id="wettkampf-meldung"
            class="meldung"
        ></p>


    </section>



    <!-- ==========================================
         WETTKÄMPFE
         ========================================== -->

    <section class="card">

        <h2>
            Vorhandene Wettkämpfe
        </h2>


        <div
            id="wettkaempfe-liste"
            class="listen-container"
        >

            <p>
                Wettkämpfe werden geladen ...
            </p>

        </div>

    </section>


</main>



<footer>

    <p>
        SSV 1928 Sulzbach e.V.
    </p>

    <p>
        Wettkampfauswertung
    </p>

</footer>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
    src="supabase.js"
></script>

<script
    src="wettkaempfe.js"
></script>


</body>

</html>
