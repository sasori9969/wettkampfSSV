<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SSV 1928 Sulzbach e.V. – Teilnehmer
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <h1>
        SSV 1928 Sulzbach e.V.
    </h1>


    <nav>

        <a href="index.html">
            Startseite
        </a>

        <a href="wettkaempfe.html">
            Wettkämpfe
        </a>

        <a href="teilnehmer.html">
            Teilnehmer
        </a>

        <a href="ergebnisse.html">
            Ergebnisse
        </a>

    </nav>

</header>



<main>


    <!-- ==========================================
         TEILNEHMER ANLEGEN
         ========================================== -->

    <section class="card">

        <h2>
            Teilnehmer verwalten
        </h2>


        <p>
            Hier können Teilnehmer angelegt,
            bearbeitet und gelöscht werden.
        </p>


        <form id="teilnehmer-form">


            <input
                type="hidden"
                id="teilnehmer-id"
            >


            <div class="form-group">

                <label for="vorname">
                    Vorname
                </label>


                <input
                    type="text"
                    id="vorname"
                    placeholder="Vorname"
                    autocomplete="given-name"
                    required
                >

            </div>



            <div class="form-group">

                <label for="nachname">
                    Nachname
                </label>


                <input
                    type="text"
                    id="nachname"
                    placeholder="Nachname"
                    autocomplete="family-name"
                    required
                >

            </div>



            <div class="form-buttons">

                <button
                    type="submit"
                    id="teilnehmer-speichern"
                >
                    Teilnehmer speichern
                </button>


                <button
                    type="button"
                    id="teilnehmer-abbrechen"
                    class="button-secondary"
                    style="display:none;"
                >
                    Bearbeitung abbrechen
                </button>

            </div>


        </form>


        <p
            id="teilnehmer-meldung"
            class="meldung"
        ></p>

    </section>



    <!-- ==========================================
         SUCHE
         ========================================== -->

    <section class="card">

        <h2>
            Teilnehmer suchen
        </h2>


        <div class="form-group">

            <label for="teilnehmer-suche">
                Suche
            </label>


            <input
                type="text"
                id="teilnehmer-suche"
                placeholder="Vorname oder Nachname"
                autocomplete="off"
            >

        </div>

    </section>



    <!-- ==========================================
         TEILNEHMERLISTE
         ========================================== -->

    <section class="card">

        <h2>
            Teilnehmer
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Vorname
                        </th>

                        <th>
                            Nachname
                        </th>

                        <th>
                            Aktionen
                        </th>

                    </tr>

                </thead>


                <tbody id="teilnehmer-liste">

                    <tr>

                        <td colspan="4">
                            Teilnehmer werden geladen ...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <p
            id="teilnehmer-anzahl"
        ></p>

    </section>


</main>



<footer>

    <p>
        SSV 1928 Sulzbach e.V.
    </p>

    <p>
        Wettkampfauswertung
    </p>

</footer>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="supabase.js"
></script>


<script
    src="teilnehmer.js"
></script>


</body>

</html>
