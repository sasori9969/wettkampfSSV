<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Teilnehmer – SSV 1928 Sulzbach e.V.
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================
         KOPFBEREICH
         ========================================== -->

    <header>

        <h1>
            SSV 1928 Sulzbach e.V.
        </h1>


        <nav>

            <a href="index.html">
                Startseite
            </a>

            <a href="teilnehmer.html">
                Teilnehmer
            </a>

            <a href="ergebnisse-eingabe.html">
                Ergebnisse erfassen
            </a>

            <a href="ergebnisse.html">
                Ergebnisse
            </a>

        </nav>

    </header>



    <!-- ==========================================
         HAUPTBEREICH
         ========================================== -->

    <main>


        <!-- ==========================================
             NEUEN TEILNEHMER ANLEGEN
             ========================================== -->

        <section class="card">

            <h2>
                Teilnehmer anlegen
            </h2>


            <p>
                Hier kannst du einen neuen Teilnehmer
                anlegen.
            </p>


            <form id="teilnehmer-form">


                <div class="form-group">

                    <label for="vorname">
                        Vorname
                    </label>


                    <input
                        type="text"
                        id="vorname"
                        name="vorname"
                        placeholder="Vorname eingeben"
                        autocomplete="given-name"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="nachname">
                        Nachname
                    </label>


                    <input
                        type="text"
                        id="nachname"
                        name="nachname"
                        placeholder="Nachname eingeben"
                        autocomplete="family-name"
                        required
                    >

                </div>



                <button
                    type="submit"
                >
                    Teilnehmer speichern
                </button>


            </form>


            <div
                id="teilnehmer-meldung"
                class="meldung"
            ></div>


        </section>



        <!-- ==========================================
             TEILNEHMERLISTE
             ========================================== -->

        <section class="card">

            <h2>
                Teilnehmer
            </h2>


            <p>
                Vorhandene Teilnehmer verwalten.
            </p>


            <div
                id="teilnehmer-liste"
                class="teilnehmer-liste"
            >

                <p>
                    Teilnehmer werden geladen ...
                </p>

            </div>


        </section>


    </main>



    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer>

        <p>
            SSV 1928 Sulzbach e.V.
        </p>

        <p>
            Wettkampfauswertung
        </p>

    </footer>



    <!-- ==========================================
         SUPABASE
         ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script
        src="app.js?v=5"
    ></script>


</body>

</html>
