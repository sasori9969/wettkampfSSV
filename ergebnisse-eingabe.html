<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ergebnisse erfassen</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================
         KOPFBEREICH
         ========================================== -->

    <header>

        <h1>
            Wettkampfauswertung
        </h1>


        <nav>

            <a href="index.html">
                Teilnehmer
            </a>

            <a href="ergebnisse-eingabe.html">
                Ergebnisse erfassen
            </a>

            <a href="ergebnisse.html">
                Ergebnisse
            </a>

        </nav>

    </header>



    <!-- ==========================================
         HAUPTBEREICH
         ========================================== -->

    <main>


        <section class="card">

            <h2>
                Ergebnisse erfassen
            </h2>


            <form id="ergebnis-form">


                <!-- Teilnehmer -->

                <div class="form-group">

                    <label for="teilnehmer">
                        Teilnehmer
                    </label>


                    <select
                        id="teilnehmer"
                        required
                    >

                        <option value="">
                            Teilnehmer auswählen
                        </option>

                    </select>

                </div>



                <!-- Ergebnis 1 -->

                <div class="form-group">

                    <label for="ergebnis1">
                        Ergebnis 1
                    </label>


                    <input
                        type="text"
                        id="ergebnis1"
                        inputmode="decimal"
                        placeholder="z. B. 12,5"
                        required
                    >

                </div>



                <!-- Ergebnis 2 -->

                <div class="form-group">

                    <label for="ergebnis2">
                        Ergebnis 2
                    </label>


                    <input
                        type="text"
                        id="ergebnis2"
                        inputmode="decimal"
                        placeholder="z. B. 13,2"
                        required
                    >

                </div>



                <!-- Ergebnis 3 -->

                <div class="form-group">

                    <label for="ergebnis3">
                        Ergebnis 3
                    </label>


                    <input
                        type="text"
                        id="ergebnis3"
                        inputmode="decimal"
                        placeholder="z. B. 11,8"
                        required
                    >

                </div>



                <!-- Speichern -->

                <button type="submit">
                    Ergebnisse speichern
                </button>


            </form>


            <!-- Rückmeldung -->

            <p
                id="ergebnis-meldung"
                class="meldung"
            ></p>


        </section>



        <!-- ==========================================
             NAVIGATION
             ========================================== -->

        <section class="card ergebnis-link">

            <h2>
                Ergebnisliste
            </h2>


            <p>
                Bereits gespeicherte Ergebnisse anzeigen.
            </p>


            <a
                class="button"
                href="ergebnisse.html"
            >
                Ergebnisse anzeigen
            </a>

        </section>


    </main>



    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer>

        <p>
            Wettkampfauswertung – Vereinsseite
        </p>

    </footer>



    <!-- ==========================================
         SUPABASE
         ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- ==========================================
         ANWENDUNG
         ========================================== -->

    <script
        src="app.js?v=2"
    ></script>


</body>

</html>
